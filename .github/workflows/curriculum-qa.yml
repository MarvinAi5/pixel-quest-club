name: Complete October curriculum verification
on:
  push:
    branches: [main]
    paths: ['public/**', 'learning/**', 'godot-reference/**', 'make_curriculum.py', 'build.py', 'tests/**', '.github/workflows/curriculum-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Build and regression tests
        run: |
          python3 make_curriculum.py
          python3 build.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_engine.cjs
          node tests/test_engine_edges.cjs
          node tests/test_app.cjs
      - name: Execute all browser lesson activities and inspect every lesson guide
        run: node tests/curriculum_browser.cjs
      - name: Install official Scratch engine for isolated tests
        if: always()
        run: |
          npm install --prefix /tmp/pqc-scratch --no-audit --no-fund scratch-vm@5.0.300 scratch-render@2.2.84 scratch-storage@6.2.1
          npm list --prefix /tmp/pqc-scratch --depth=0 --json > qa-artifacts/scratch-versions.json
      - name: Execute 16 Scratch checkpoints in real Chromium
        if: always()
        run: node tests/scratch_lessons.cjs
      - name: Install Godot 4.7.2 for isolated tests
        if: always()
        run: |
          curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Execute 23 Godot feature checkpoints
        if: always()
        run: |
          mkdir -p qa-artifacts
          cp tests/godot_course.gd godot-reference/CourseTest.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-reference --editor --import --quit 2>&1 | tee qa-artifacts/godot-import.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot-reference --script CourseTest.gd 2>&1 | tee qa-artifacts/godot-run.log
          python3 -c "import json; assert json.load(open('qa-artifacts/godot-results.json'))['status']=='passed'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-curriculum-evidence
          path: qa-artifacts/
          retention-days: 14
