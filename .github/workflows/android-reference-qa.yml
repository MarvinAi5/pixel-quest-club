name: Android reference export verification
on:
  push:
    branches: [main]
    paths: ['godot-reference/**', 'learning/build_godot.py', 'tests/android_export.py', '.github/workflows/android-reference-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare disposable Godot and Android templates
        run: |
          python3 learning/build_godot.py
          curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz templates/android_debug.apk -d /tmp/pqc-templates
          sdkmanager "build-tools;35.0.1" "platforms;android-35"
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot-reference --import --quit
      - name: Export ARM64 debug APK and verify signature
        run: python3 tests/android_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reference-export-evidence
          path: |
            qa-artifacts/android-*
            qa-artifacts/pixel-quest-reference-debug.apk
          retention-days: 14
